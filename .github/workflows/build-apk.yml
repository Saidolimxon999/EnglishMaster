
name: Build EnglishMaster APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6
          mkdir -p www
          cp index.html www/index.html
          npx cap init EnglishMaster com.englishmaster.app --web-dir=www
          npx cap add android

      - name: Add microphone permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
          """

          if "android.permission.RECORD_AUDIO" not in s:
              s = s.replace("<application", permissions + "\n    <application", 1)

          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishMaster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
