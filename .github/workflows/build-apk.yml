
name: Build EnglishMaster APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Capacitor project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install -D @capacitor/cli@6
          mkdir -p www
          cp index.html www/index.html
          npx cap init EnglishMaster com.englishmaster.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: EnglishMaster-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
